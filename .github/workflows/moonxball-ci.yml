name: MoonXBall CI

# ---------------------------------------------------------------------------
# MoonXBall continuous-integration + auto-release workflow.
#
# IMPORTANT — read this before enabling:
# ---------------------------------------------------------------------------
# BlockBall depends on PRIVATE Shynixn MCUtils libraries:
#   com.github.shynixn.mcutils:{common:2026.18, packet:2026.32,
#   worldguard:2026.1, database:2026.3, http:2026.3}
# These artifacts are NOT on Maven Central or jitpack. They live behind
# Shynixn's Patreon paywall at a private maven URL.
#
# To build the full plugin jars you MUST set this repository secret:
#   Name:  SHYNIXN_MCUTILS_REPOSITORY_2026
#   Value: the private maven URL Shynixn gives you via Patreon
#
# Repo settings → Secrets and variables → Actions → New repository secret.
#
# WITHOUT that secret:
#   * The build step is SKIPPED (not failed).
#   * The workflow still runs the pure-Kotlin unit tests in
#     LegacyScoreboardLineSplitterTest (no MCUtils deps).
#   * The release (if triggered) publishes a SOURCE-ONLY tarball, the
#     bundled MX_Blocball2.yml, and CHANGES.md — NO binary jars.
#   * A clear notice is printed to the job summary.
#
# To get binary jars, you need to either:
#   (a) subscribe to Shynixn's Patreon and set the secret, OR
#   (b) build locally with `./gradlew pluginJars` on a machine that
#       has the MCUtils artifacts cached in ~/.gradle/caches, then
#       upload the jars to the release manually.
# ---------------------------------------------------------------------------

permissions:
  contents: write
  packages: write
  actions: read

on:
  push:
    branches: [ master, main, development, moonxball, feature/moonxball-fork ]
    tags:    [ 'v*' ]
  pull_request:
    branches: [ master, main, development ]
  workflow_dispatch:
    inputs:
      release:
        description: 'Create a GitHub Release from this run?'
        type: boolean
        default: false
      version_override:
        description: 'Optional: override the version tag (e.g. 7.45.1). Leave blank to use the Gradle project version.'
        type: string
        default: ''
      force_build:
        description: 'Force the build step even if SHYNIXN_MCUTILS_REPOSITORY_2026 is missing (will fail with 403s).'
        type: boolean
        default: false

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # -------------------------------------------------------------------------
  # JOB 1: Build + test (or just test if private deps are unavailable).
  # -------------------------------------------------------------------------
  build:
    name: Build & Test
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      should_release: ${{ steps.version.outputs.should_release }}
      has_private_deps: ${{ steps.check_secret.outputs.has_secret }}
      build_skipped: ${{ steps.build_status.outputs.skipped }}
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Cache Gradle dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
            .gradle
          key: ${{ runner.os }}-gradle-21-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-21-

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      - name: Check for private Shynixn MCUtils secret
        id: check_secret
        shell: bash
        env:
          MCUTILS_REPO: ${{ secrets.SHYNIXN_MCUTILS_REPOSITORY_2026 }}
        run: |
          set -e
          if [ -z "$MCUTILS_REPO" ]; then
            echo "::warning::Secret SHYNIXN_MCUTILS_REPOSITORY_2026 is not set. The full plugin jar build will be SKIPPED. See the top of .github/workflows/moonxball-ci.yml for instructions."
            echo "has_secret=false" >> "$GITHUB_OUTPUT"
          else
            echo "has_secret=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Print version (capture for release tagging)
        id: version
        env:
          SHYNIXN_MCUTILS_REPOSITORY_2026: ${{ secrets.SHYNIXN_MCUTILS_REPOSITORY_2026 }}
        shell: bash
        run: |
          set -e
          # `printVersion` works even without the MCUtils secret because it
          # only inspects the project version — no dependency resolution.
          PROJECT_VERSION="$(./gradlew -q printVersion --offline 2>/dev/null | tail -n 1 | tr -d '[:space:]' || echo '')"
          if [ -z "$PROJECT_VERSION" ]; then
            # Fallback: read directly from build.gradle.kts
            PROJECT_VERSION="$(grep -E '^\s*version\s*=' build.gradle.kts | head -1 | sed -E 's/.*"([^"]+)".*/\1/')"
          fi
          if [ -z "$PROJECT_VERSION" ]; then
            PROJECT_VERSION="0.0.0-unknown"
          fi
          echo "version=$PROJECT_VERSION" >> "$GITHUB_OUTPUT"

          SHOULD="false"
          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            SHOULD="true"
          elif [[ "${{ github.event_name }}" == "workflow_dispatch" && "${{ inputs.release }}" == "true" ]]; then
            SHOULD="true"
          elif [[ "${{ github.event_name }}" == "push" ]] && \
               grep -q -- '--release' <<< "$(git log -1 --pretty=%B)"; then
            SHOULD="true"
          fi
          echo "should_release=$SHOULD" >> "$GITHUB_OUTPUT"
          echo "Resolved version: $PROJECT_VERSION  (should_release=$SHOULD)"

      # ---- Branch A: full build (requires the secret) -------------------

      - name: Build + test + assemble jars (full)
        id: build_full
        if: ${{ steps.check_secret.outputs.has_secret == 'true' || inputs.force_build == true }}
        env:
          SHYNIXN_MCUTILS_REPOSITORY_2026: ${{ secrets.SHYNIXN_MCUTILS_REPOSITORY_2026 }}
        run: |
          set -e
          ./gradlew --no-daemon --stacktrace clean build pluginJars
          echo "skipped=false" >> "$GITHUB_OUTPUT"

      - name: Verify expected jars exist (full build only)
        if: ${{ steps.build_full.outcome == 'success' }}
        run: |
          set -e
          V="${{ steps.version.outputs.version }}"
          echo "Project version: $V"
          ls -la build/libs/
          expected=(
            "BlockBall-${V}-1.8.8-1.16.5-premium.jar"
            "BlockBall-${V}-1.17.0-1.21.11-premium.jar"
            "BlockBall-${V}-1.17.0-1.21.11-premium-folia.jar"
            "BlockBall-${V}-26.1.0-latest-premium.jar"
            "BlockBall-${V}-26.1.0-latest-premium-folia.jar"
            "BlockBall-${V}-26.1.0-latest-free.jar"
          )
          missing=0
          for jar in "${expected[@]}"; do
            if [ ! -f "build/libs/$jar" ]; then
              echo "❌ MISSING: build/libs/$jar"
              missing=$((missing+1))
            else
              echo "✅ OK:      build/libs/$jar"
            fi
          done
          if [ "$missing" -gt 0 ]; then
            echo "::error::$missing jar(s) were not produced by the build."
            exit 1
          fi

      - name: Stage release artifacts (full build)
        if: ${{ steps.build_full.outcome == 'success' }}
        run: |
          set -e
          V="${{ steps.version.outputs.version }}"
          mkdir -p staging
          cp "build/libs/BlockBall-${V}-1.8.8-1.16.5-premium.jar"          "staging/MoonXBall-1.8.8-1.16.5-Premium.jar"
          cp "build/libs/BlockBall-${V}-1.17.0-1.21.11-premium.jar"        "staging/MoonXBall-1.17.0-1.21.11-Premium.jar"
          cp "build/libs/BlockBall-${V}-1.17.0-1.21.11-premium-folia.jar"  "staging/MoonXBall-1.17.0-1.21.11-Premium-Folia.jar"
          cp "build/libs/BlockBall-${V}-26.1.0-latest-premium.jar"         "staging/MoonXBall-26.1.0-latest-Premium.jar"
          cp "build/libs/BlockBall-${V}-26.1.0-latest-premium-folia.jar"   "staging/MoonXBall-26.1.0-latest-Premium-Folia.jar"
          cp "build/libs/BlockBall-${V}-26.1.0-latest-free.jar"            "staging/MoonXBall-26.1.0-latest-Free.jar"
          cp "src/main/resources/MX_Blocball2.yml"                          "staging/MX_Blocball2.example.yml"
          cp "CHANGES.md"                                                  "staging/CHANGES.md"
          ls -la staging/

      # ---- Branch B: source-only build (secret missing) ------------------

      - name: Source-only path — package source tarball
        id: build_status
        if: ${{ steps.build_full.outcome != 'success' }}
        run: |
          set -e
          echo "::notice::Full build was skipped because SHYNIXN_MCUTILS_REPOSITORY_2026 is not set. Publishing source-only artifacts."
          mkdir -p staging
          # Source tarball
          tar --exclude='.git' --exclude='build' --exclude='.gradle' \
              -czf "staging/MoonXBall-${{ steps.version.outputs.version }}-src.tar.gz" .
          # Standalone copies of the new files so server admins can preview them
          cp "src/main/resources/MX_Blocball2.yml"                          "staging/MX_Blocball2.example.yml"
          cp "CHANGES.md"                                                  "staging/CHANGES.md"
          # All new Kotlin source files (no MCUtils deps required to read)
          mkdir -p staging/source-new
          for dir in compat scoreboard config hooks listeners gui; do
            if [ -d "src/main/java/com/github/shynixn/blockball/$dir" ]; then
              mkdir -p "staging/source-new/$dir"
              cp -r "src/main/java/com/github/shynixn/blockball/$dir/." "staging/source-new/$dir/"
            fi
          done
          ls -la staging/
          echo "skipped=true" >> "$GITHUB_OUTPUT"

      - name: Try to run pure-Kotlin unit tests
        id: tests
        if: ${{ steps.build_full.outcome != 'success' }}
        continue-on-error: true
        env:
          SHYNIXN_MCUTILS_REPOSITORY_2026: ${{ secrets.SHYNIXN_MCUTILS_REPOSITORY_2026 }}
        run: |
          # This will most likely fail because compileKotlin needs MCUtils.
          # We attempt it anyway so the test report is uploaded; failure is
          # non-fatal because the user has been warned about the secret.
          ./gradlew --no-daemon --stacktrace test || true

      - name: Upload build artifacts (workflow run)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: MoonXBall-build
          path: |
            staging/
            build/libs/
            build/reports/
            build/test-results/
          if-no-files-found: warn
          retention-days: 14

      - name: Write job summary
        if: always()
        shell: bash
        run: |
          cat >> "$GITHUB_STEP_SUMMARY" <<EOF
          ## MoonXBall CI — Build Summary

          **Version:** \`${{ steps.version.outputs.version }}\`
          **Private deps secret:** \`${{ steps.check_secret.outputs.has_secret }}\`
          **Full build:** \`${{ steps.build_full.outcome || 'skipped' }}\`

          EOF
          if [ "${{ steps.check_secret.outputs.has_secret }}" != "true" ]; then
            cat >> "$GITHUB_STEP_SUMMARY" <<'EOF'
          > ⚠️ **The full plugin jar build was SKIPPED.**
          >
          > The BlockBall project depends on **private** Shynixn MCUtils
          > libraries (com.github.shynixn.mcutils:*) which are not available
          > on Maven Central or jitpack. They require a Patreon subscription
          > and a private maven URL.
          >
          > To enable binary jar builds:
          > 1. Obtain the \`SHYNIXN_MCUTILS_REPOSITORY_2026\` value from
          >    Shynixn's Patreon.
          > 2. Repo Settings → Secrets and variables → Actions →
          >    New repository secret → name it
          >    \`SHYNIXN_MCUTILS_REPOSITORY_2026\` and paste the URL.
          > 3. Re-run this workflow.
          >
          > This run still published a SOURCE-ONLY tarball + the
          > MX_Blocball2.yml example + CHANGES.md.

          EOF
          fi

  # -------------------------------------------------------------------------
  # JOB 2: Auto-release to GitHub Releases.
  # -------------------------------------------------------------------------
  release:
    name: Publish GitHub Release
    needs: build
    if: ${{ needs.build.outputs.should_release == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Cache Gradle dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
            .gradle
          key: ${{ runner.os }}-gradle-21-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-21-

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      - name: Resolve release tag
        id: tag
        shell: bash
        run: |
          set -e
          if [[ "${GITHUB_REF}" == refs/tags/* ]]; then
            TAG="${GITHUB_REF#refs/tags/}"
          elif [[ -n "${{ inputs.version_override }}" ]]; then
            TAG="v${{ inputs.version_override }}"
          else
            TAG="v${{ needs.build.outputs.version }}"
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "Release tag will be: $TAG"

      - name: Rebuild jars (full path — only if secret available)
        id: release_build
        if: ${{ needs.build.outputs.has_private_deps == 'true' }}
        env:
          SHYNIXN_MCUTILS_REPOSITORY_2026: ${{ secrets.SHYNIXN_MCUTILS_REPOSITORY_2026 }}
        run: |
          set -e
          ./gradlew --no-daemon --stacktrace clean build pluginJars
          V="${{ needs.build.outputs.version }}"
          mkdir -p release
          cp "build/libs/BlockBall-${V}-1.8.8-1.16.5-premium.jar"          "release/MoonXBall-1.8.8-1.16.5-Premium.jar"
          cp "build/libs/BlockBall-${V}-1.17.0-1.21.11-premium.jar"        "release/MoonXBall-1.17.0-1.21.11-Premium.jar"
          cp "build/libs/BlockBall-${V}-1.17.0-1.21.11-premium-folia.jar"  "release/MoonXBall-1.17.0-1.21.11-Premium-Folia.jar"
          cp "build/libs/BlockBall-${V}-26.1.0-latest-premium.jar"         "release/MoonXBall-26.1.0-latest-Premium.jar"
          cp "build/libs/BlockBall-${V}-26.1.0-latest-premium-folia.jar"   "release/MoonXBall-26.1.0-latest-Premium-Folia.jar"
          cp "build/libs/BlockBall-${V}-26.1.0-latest-free.jar"            "release/MoonXBall-26.1.0-latest-Free.jar"
          cp "src/main/resources/MX_Blocball2.yml"                          "release/MX_Blocball2.example.yml"
          cp "CHANGES.md"                                                  "release/CHANGES.md"
          ls -la release/

      - name: Stage source-only artifacts (when secret missing)
        id: release_source
        if: ${{ needs.build.outputs.has_private_deps != 'true' }}
        run: |
          set -e
          mkdir -p release
          tar --exclude='.git' --exclude='build' --exclude='.gradle' \
              -czf "release/MoonXBall-${{ needs.build.outputs.version }}-src.tar.gz" .
          cp "src/main/resources/MX_Blocball2.yml"                          "release/MX_Blocball2.example.yml"
          cp "CHANGES.md"                                                  "release/CHANGES.md"
          ls -la release/

      - name: Generate release notes from CHANGES.md
        id: notes
        shell: bash
        run: |
          set -e
          BODY="$(awk '
            /^---/ { if (found) exit; next }
            /^## / { found=1; next }
            found { print }
          ' CHANGES.md)"
          if [ -z "$BODY" ]; then
            BODY="MoonXBall ${{ needs.build.outputs.version }} — see CHANGES.md for the full changelog."
          fi
          if [ "${{ needs.build.outputs.has_private_deps }}" != "true" ]; then
            BODY="$BODY

          ---
          ⚠️ **SOURCE-ONLY RELEASE**
          This release does NOT include compiled plugin jars because the
          private Shynixn MCUtils maven repository is not configured in CI.
          See the top of \`.github/workflows/moonxball-ci.yml\` for how to
          enable binary builds.
          "
          fi
          {
            echo "body<<EOF_MOONXBALL"
            echo "$BODY"
            echo ""
            echo "---"
            echo "**Build:** GitHub Actions run ${{ github.run_id }}"
            echo "**Commit:** ${{ github.sha }}"
            echo "**JDK:** 21 (temurin)"
            echo "**Gradle:** 8.12.1 (wrapper)"
            echo "**Private deps:** ${{ needs.build.outputs.has_private_deps }}"
            echo "EOF_MOONXBALL"
          } >> "$GITHUB_OUTPUT"

      - name: Create GitHub Release + upload all artifacts
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag.outputs.tag }}
          name: MoonXBall ${{ steps.tag.outputs.tag }}
          body: ${{ steps.notes.outputs.body }}
          draft: false
          prerelease: ${{ contains(steps.tag.outputs.tag, 'rc') || contains(steps.tag.outputs.tag, 'beta') || contains(steps.tag.outputs.tag, 'alpha') || (needs.build.outputs.has_private_deps != 'true') }}
          generate_release_notes: false
          files: |
            release/MoonXBall-1.8.8-1.16.5-Premium.jar
            release/MoonXBall-1.17.0-1.21.11-Premium.jar
            release/MoonXBall-1.17.0-1.21.11-Premium-Folia.jar
            release/MoonXBall-26.1.0-latest-Premium.jar
            release/MoonXBall-26.1.0-latest-Premium-Folia.jar
            release/MoonXBall-26.1.0-latest-Free.jar
            release/MoonXBall-${{ needs.build.outputs.version }}-src.tar.gz
            release/MX_Blocball2.example.yml
            release/CHANGES.md
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Summary
        shell: bash
        run: |
          cat >> "$GITHUB_STEP_SUMMARY" <<EOF
          ## ✅ MoonXBall Release Published

          **Tag:** \`${{ steps.tag.outputs.tag }}\`
          **Version:** \`${{ needs.build.outputs.version }}\`
          **Binary jars:** \`${{ needs.build.outputs.has_private_deps == 'true' }}\`

          View the release at: ${{ github.server_url }}/${{ github.repository }}/releases/tag/${{ steps.tag.outputs.tag }}
          EOF
